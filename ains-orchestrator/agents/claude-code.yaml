# The only agent harness in this PoC: a fresh headless Claude Code CLI process per stage.
name: claude-code
command: ["claude", "-p", "--output-format", "json", "--settings", "/app/claude-settings.json"]
# Only these variables reach the subprocess. Anything ANTHROPIC_* is forbidden by the schema.
env_passthrough: [CLAUDE_CODE_OAUTH_TOKEN]
stages:
  spec:      {prompt: agents/stages/spec.md,      permission_mode: acceptEdits, max_turns: 30}
  plan:      {prompt: agents/stages/plan.md,      permission_mode: acceptEdits, max_turns: 30}
  implement: {prompt: agents/stages/implement.md, permission_mode: acceptEdits, max_turns: 80}
  review:    {prompt: agents/stages/review.md,    permission_mode: default,     max_turns: 25, read_only: true}
  story:     {prompt: agents/stages/story.md,     permission_mode: default,     max_turns: 12, read_only: true}
retry: {attempts: 2, backoff_seconds: 300}
wall_clock_limit_minutes: 30
