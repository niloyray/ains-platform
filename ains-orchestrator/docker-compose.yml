# The platform runtime on the laptop: one container, no published ports, resumable state on a named volume.
#   cp .env.example .env   # then fill the values (never committed)
#   docker compose up -d --build
#   docker compose exec orchestrator ains doctor
services:
  orchestrator:
    build: .
    image: ains-orchestrator:local
    container_name: ains-orchestrator
    env_file: .env
    environment:
      AINS_CONFIG_ROOT: /app
      AINS_WORK_DIR: /work
      AINS_DATA_DIR: /data
      AINS_POLL_SECONDS: ${AINS_POLL_SECONDS:-60}
    volumes:
      - ains-workspaces:/work                      # story clones: throwaway
      - ains-data:/data                            # sessions.sqlite, heartbeat.json, logs/: durable; ains-platform.cmd backup
      # config is mounted, not baked: `ains target add` edits take effect on the next poll without a rebuild
      - ./targets.yaml:/app/targets.yaml:ro
      - ./profiles.yaml:/app/profiles.yaml:ro
      - ./flows:/app/flows:ro
      - ./agents:/app/agents:ro
      - ./claude-settings.json:/app/claude-settings.json:ro
    restart: unless-stopped
    # no ports: intake is by polling (D3); nothing reaches this container from outside
    stop_grace_period: 2m

  # The management portal: same image, read-only view of the same volume and config, plus onboarding.
  # Published on the laptop's loopback interface only (D3: nothing from outside reaches the platform).
  portal:
    image: ains-orchestrator:local
    container_name: ains-portal
    command: ["ains", "portal", "--host", "0.0.0.0", "--port", "8787"]
    env_file: .env
    environment:
      AINS_CONFIG_ROOT: /app
      AINS_WORK_DIR: /work
      AINS_DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ains-workspaces:/work
      - ains-data:/data
      - ./targets.yaml:/app/targets.yaml          # read-write: onboarding from the portal appends the target block
      - ./profiles.yaml:/app/profiles.yaml:ro
      - ./flows:/app/flows:ro
      - ./agents:/app/agents:ro
      - ./claude-settings.json:/app/claude-settings.json:ro
      - ../bootstrap/templates:/app/bootstrap/templates:ro
      - ../.claude/skills:/app/skills:ro          # the /ains skill shipped into every project
      - ../docs:/app/docs:ro
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  ains-workspaces:
  ains-data:
