[project]
name = "ains-orchestrator"
version = "0.1.0"
description = "AINS orchestrator: polls Jira, spawns Claude Code CLI stage agents, runs gates, pushes PRs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
ains = "ains_orchestrator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ains_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs real Jira/GitHub/Claude credentials (AINS_LIVE=1)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
